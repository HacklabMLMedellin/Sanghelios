# Hiperparámetros del modelo predictivo y del asistente generativo.
# Fuente de verdad en código: src/train.py (XGBoost) y
# src/agents/citizen_agent.py (LLM).

escasez_t14:
  algoritmo: XGBClassifier
  horizonte_dias: 14 # src/features/build_features.py (H)
  test_frac: 0.2 # partición temporal, el 20 % final es test
  hiperparametros:
    n_estimators: 400
    max_depth: 3
    learning_rate: 0.04
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    random_state: 42
    eval_metric: logloss
    scale_pos_weight: auto # negativos/positivos, calculado al entrenar
  umbral_decision:
    metodo: out-of-fold sobre TimeSeriesSplit (5 folds)
    metrica: fbeta
    beta: 2.0 # prioriza recall: perder una alerta cuesta más que una falsa
  umbral_tau:
    definicion: percentil 75 de la presión del tramo de entrenamiento

llm:
  proveedor: Google Gemini
  modelo: gemini-2.5-flash
  uso: asistente de campañas y búsqueda de lugares
  respaldo: generador por reglas, sin dependencia externa
