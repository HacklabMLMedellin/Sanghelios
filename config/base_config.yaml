# Configuración general del entorno Sanghelios.
# Documenta los valores canónicos del pipeline; la fuente de verdad en código
# está en el módulo indicado junto a cada bloque.

proyecto:
  nombre: Sanghelios
  version: "0.1.0"
  descripcion: Inteligencia predictiva para bancos de sangre (HGM Medellín)

rutas: # relativas a la raíz del repositorio
  datos_crudos: data/raw
  datos_procesados: data/processed
  datos_tiempo_real: data/realtime # reservado (integración futura IoT/APIs)
  base_datos: data/sanghelios.db # src/train.py · src/app.py
  modelo: models/predictive/escasez_model.pkl # src/train.py · src/inference.py
  figuras: reports/figures

serie: # src/data_pipeline/transform.py
  fecha_inicio: "2022-01-02"
  fecha_fin: "2025-06-27"
  frecuencia: D

servidor: # main.py / uvicorn
  host: 0.0.0.0
  puerto: 8000

entorno:
  gestor_dependencias: uv
  python: "3.13"
  variables_env: # definidas en .env (no versionado)
    - GEMINI_API_KEY
