# Autoescalado horizontal de la API según la demanda ciudadana.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sanghelios-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sanghelios-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
