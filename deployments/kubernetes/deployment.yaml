# Despliegue de la API en Kubernetes (imagen de deployments/docker/Dockerfile.api).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanghelios-api
  labels:
    app: sanghelios-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanghelios-api
  template:
    metadata:
      labels:
        app: sanghelios-api
    spec:
      containers:
        - name: api
          image: sanghelios-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sanghelios-secrets
                  key: gemini-api-key
                  optional: true # sin la clave, el asistente cae al generador por reglas
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/meta
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sanghelios-api
spec:
  selector:
    app: sanghelios-api
  ports:
    - port: 80
      targetPort: 8000
