# Automatización de pruebas y linter en cada push/PR.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv (con Python 3.13)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Linter (ruff)
        run: uv run ruff check src scripts tests

      - name: Pruebas (unitarias + integración + sesgo)
        run: uv run pytest tests -v
