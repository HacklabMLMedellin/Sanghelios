# Orquestación programada: refresca los datos abiertos desde datos.gov.co,
# reentrena el modelo y verifica que el pipeline completo siga sano.
name: Actualización de datos

on:
  schedule:
    - cron: "0 6 1 * *" # primer día de cada mes, 06:00 UTC
  workflow_dispatch: # también ejecutable a mano desde la pestaña Actions

jobs:
  refrescar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv (con Python 3.13)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Ingesta desde datos.gov.co
        run: uv run python -m src.data_pipeline.ingest

      - name: Reentrenar modelo y reconstruir BD
        run: uv run python scripts/build_db_and_model.py

      - name: Reporte automático del analista
        run: uv run python -m src.agents.analyst_agent

      - name: Pruebas de validación
        run: uv run pytest tests -q

      - name: Resumen de cambios en los datos
        run: git diff --stat data/ models/ reports/ || true
